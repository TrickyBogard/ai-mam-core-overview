    <text x="215" y="11" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" letter-spacing="2.3" fill="#BBC8B9">/ PRODUCT OVERVIEW</text>
  </g>

  <text x="90" y="203" font-family="Georgia, 'Times New Roman', DejaVu Serif, serif" font-weight="700" font-size="69" fill="#F3F0E7">AI can act.</text>
  <text x="90" y="279" font-family="Georgia, 'Times New Roman', DejaVu Serif, serif" font-weight="700" font-size="55" fill="#D4A17E">Work should be verifiable.</text>
  <rect x="92" y="300" width="99" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="90" y="348" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#D6DED4">A control layer for AI tasks, evidence, and accountable acceptance.</text>

