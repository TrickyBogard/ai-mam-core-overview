    <rect x="255" y="416" width="151" height="40" rx="10" fill="#23382D" stroke="#678572" stroke-opacity=".58"/>
    <rect x="420" y="416" width="151" height="40" rx="10" fill="#23382D" stroke="#678572" stroke-opacity=".58"/>
