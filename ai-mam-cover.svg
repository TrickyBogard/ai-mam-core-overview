<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title description">
  <title id="title">AI-MAM Core — AI can act. Work should be verifiable.</title>
  <desc id="description">Dark forest-green and pastel-peach product banner illustrating an orderly, traceable AI workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#101A16"/>
      <stop offset="64%" stop-color="#17251D"/>
      <stop offset="100%" stop-color="#23382D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A17E" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#D4A17E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#B9CCBD" opacity=".18"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#D4A17E"/>
      <stop offset="100%" stop-color="#E7C1A8"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="520" rx="28" fill="url(#background)"/>
  <rect width="1440" height="520" rx="28" fill="url(#dots)" opacity=".52"/>
  <rect x="26" y="26" width="1388" height="468" rx="22" fill="none" stroke="#789383" stroke-opacity=".27"/>
  <path d="M 90 112 H 1350" stroke="#789383" stroke-opacity=".35"/>
  <path d="M 90 391 H 1350" stroke="#789383" stroke-opacity=".28"/>

