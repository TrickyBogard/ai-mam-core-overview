  <circle cx="1178" cy="255" r="118" fill="none" stroke="#8FAE99" stroke-opacity=".23" stroke-width="1.5" stroke-dasharray="6 10"/>
  <circle cx="1178" cy="255" r="74" fill="#1B2A22" stroke="#D4A17E" stroke-opacity=".75" stroke-width="1.5"/>
  <path d="M 1125 255 H 1231 M 1178 202 V 308" stroke="#D4A17E" stroke-opacity=".55" stroke-width="1"/>
